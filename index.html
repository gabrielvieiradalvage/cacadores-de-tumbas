<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sitemap - Caçadores da Tumba</title>
    <style>
        :root {
            --main-blue: #3a89c9;
            --sub-blue: #4fc3f7;
            --leaf-green: #66bb6a;
            --line-color: #bdbdbd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .sitemap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estrutura de Nós */
        .node {
            color: white;
            padding: 15px 25px;
            font-weight: bold;
            text-align: center;
            border-radius: 2px;
            min-width: 140px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Cores dos Níveis */
        .level-1 { background-color: var(--main-blue); font-size: 22px; width: 200px; }
        .level-2 { background-color: var(--sub-blue); margin-bottom: 20px; }
        .level-3 { background-color: var(--leaf-green); margin-bottom: 10px; font-size: 14px; text-align: left; }

        /* Container das Colunas */
        .columns-container {
            display: flex;
            gap: 40px;
            position: relative;
            margin-top: 40px;
        }

        /* Linhas Conectoras Superiores */
        .columns-container::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: var(--line-color);
        }

        .column {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Linha Vertical que desce do topo para cada coluna */
        .column::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            width: 2px;
            height: 20px;
            background-color: var(--line-color);
        }

        /* Linhas Verticais laterais para os itens verdes */
        .sub-items {
            border-left: 3px solid var(--line-color);
            margin-left: 10px;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
        }

        /* Linha horizontal conectando o item verde à linha vertical */
        .level-3 {
            position: relative;
        }
        .level-3::before {
            content: "";
            position: absolute;
            left: -23px;
            top: 50%;
            width: 20px;
            height: 2px;
            background-color: var(--line-color);
        }

        .home-line {
            width: 2px;
            height: 20px;
            background-color: var(--line-color);
        }
    </style>
</head>
<body>

<div class="sitemap">
    <div class="node level-1">Home</div>
    <div class="home-line"></div>

    <div class="columns-container">
        
        <div class="column">
            <div class="node level-2">Sobre</div>
            <div class="sub-items">
                <div class="node level-3">Giovanni, Lucas, Gabriel</div>
                <div class="node level-3">O Projeto Roguelike</div>
            </div>
        </div>

        <div class="column">
            <div class="node level-2">Personagens</div>
            <div class="sub-items">
                <div class="node level-3">Pedro (Tanque)</div>
                <div class="node level-3">Ingrid (Suporte)</div>
                <div class="node level-3">Otávio (Distância)</div>
                <div class="node level-3">Uriel (Versátil)</div>
            </div>
        </div>

        <div class="column">
            <div class="node level-2">Mecânicas</div>
            <div class="sub-items">
                <div class="node level-3">Troca em Tempo Real</div>
                <div class="node level-3">Teclas U, I, O e P</div>
                <div class="node level-3">Mapas Procedurais</div>
            </div>
        </div>

        <div class="column">
            <div class="node level-2">Gameplay</div>
            <div class="sub-items">
                <div class="node level-3">Tutorial (Pedro)</div>
                <div class="node level-3">Risco e Recompensa</div>
                <div class="node level-3">Evolução do Jogador</div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
