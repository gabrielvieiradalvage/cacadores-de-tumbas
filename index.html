<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sitemap - Caçadores da Tumba</title>
    <style>
        :root {
            --main-blue: #3a89c9;
            --sub-blue: #4fc3f7;
            --leaf-green: #66bb6a;
            --line-color: #bdbdbd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .sitemap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estrutura de Nós */
        .node {
            color: white;
            padding: 12px 20px;
            font-weight: bold;
            text-align: center;
            border-radius: 2px;
            min-width: 160px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Cores dos Níveis */
        .level-1 { background-color: var(--main-blue); font-size: 22px; width: 220px; }
        .level-2 { background-color: var(--sub-blue); margin-bottom: 20px; }
        .level-3 { background-color: var(--leaf-green); margin-bottom: 8px; font-size: 13px; text-align: left; }

        /* Container das Colunas */
        .columns-container {
            display: flex;
            gap: 30px;
            position: relative;
            margin-top: 40px;
        }

        /* Linhas Conectoras Superiores */
        .columns-container::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 12%;
            right: 12%;
            height: 2px;
            background-color: var(--line-color);
        }

        .column {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Linha Vertical do topo para cada coluna */
        .column::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            width: 2px;
            height: 20px;
            background-color: var(--line-color);
        }

        /* Linhas Verticais laterais para os itens verdes */
        .sub-items {
            border-left: 3px solid var(--line-color);
            margin-left: 10px;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
        }

        /* Linha horizontal conectando o item verde */
        .level-3 {
            position: relative;
        }
        .level-3::before {
            content: "";
            position: absolute;
            left: -23px;
            top: 50%;
            width: 20px;
            height: 2px;
            background-color: var(--line-color);
        }

        .home-line {
            width: 2px;
            height: 20px;
            background-color: var(--line-color);
        }
    </style>
</head>
<body>

<div class="sitemap">
    <!-- Nível 1 -->
    <div class="node level-1">Caçadores da Tumba</div>
    <div class="home-line"></div>

    <div class="columns-container">
        
        <!-- Coluna 1: Criadores -->
        <div class="column">
            <div class="node level-2">Equipe</div>
            <div class="sub-items">
                <div class="node level-3">Giovanni</div>
                <div class="node level-3">Gabriel Dalvage</div>
                <div class="node level-3">Lucas Leonardo</div>
            </div>
        </div>

        <!-- Coluna 2: Personagens -->
        <div class="column">
            <div class="node level-2">Troca (U, I, O, P)</div>
            <div class="sub-items">
                <div class="node level-3">Pedro (Tanque)</div>
                <div class="node level-3">Ingrid (Suporte)</div>
                <div class="node level-3">Otávio (Dano)</div>
                <div class="node level-3">Uriel (Versátil)</div>
            </div>
        </div>

        <!-- Coluna 3: Formações Táticas -->
        <div class="column">
            <div class="node level-2">Formações</div>
            <div class="sub-items">
                <div class="node level-3">5: Fileira</div>
                <div class="node level-3">6: Quadrada (2x2)</div>
                <div class="node level-3">7: Cada um por si</div>
                <div class="node level-3">8: Agrupar Todos</div>
            </div>
        </div>

        <!-- Coluna 4: Gameplay Estratégica -->
        <div class="column">
            <div class="node level-2">Movimentação</div>
            <div class="sub-items">
                <div class="node level-3">Livre com Estratégia</div>
                <div class="node level-3">Controle Individual</div>
                <div class="node level-3">Progressão Roguelike</div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
